name: Rendering results
on:
  push:
    branches: [ main ]
jobs:
  render-and-archive:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install make pandoc graphviz gnuplot latexmk texlive-xetex texlive-lang-cyrillic

    - name: 'Task #1'
      if: success() || failure()
      run: |
        make task1

    - name: 'Task #2'
      if: success() || failure()
      run: |
        make task2

    - name: 'Task #3'
      if: success() || failure()
      run: |
        make task3

    - name: 'Task #4'
      if: success() || failure()
      run: |
        make task4

    - name: Archive rendered artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rendered
        path: |
          solution/task1.pdf
          solution/task2.pdf
          solution/task3.png
          solution/task4.png
      if: success() || failure()
